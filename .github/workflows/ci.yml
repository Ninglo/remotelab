name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # GitHub-hosted runners appear inside a system service cgroup but cannot
      # create transient systemd services. Keep integration tests on the
      # supported unprivileged detached-process path.
      REMOTELAB_DISABLE_SYSTEMD_DETACHED_RUNNER: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 18.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run smoke tests
        run: npm test

      - name: Report oversized source files
        run: npm run lint:filesize -- --github-actions
