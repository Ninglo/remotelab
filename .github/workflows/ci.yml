name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # GitHub-hosted runners appear inside a system service cgroup but cannot
      # create transient systemd services. Keep integration tests on the
      # supported unprivileged detached-process path.
      REMOTELAB_DISABLE_SYSTEMD_DETACHED_RUNNER: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 18.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify package boundary
        run: node tests/test-package-publish-boundary.mjs

      - name: Verify social publishing without real accounts
        run: node scripts/run-with-clean-instance-env.mjs node --test tests/test-social-publish.mjs

      - name: Run smoke tests
        run: npm test

      - name: Run automation lifecycle checks
        run: npm run test:triggers

      - name: Report oversized source files
        run: npm run lint:filesize -- --github-actions

  recording-macos:
    name: recording macOS adapter
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Compile device-specific keypad adapter (no device access)
        run: swiftc scripts/recording-input-macos.swift -o "$RUNNER_TEMP/remotelab-recording-input"
      - name: Verify recording indicator states (no device access)
        run: |
          swiftc scripts/recording-panel-state.swift tests/test-recording-panel-state.swift -o "$RUNNER_TEMP/recording-panel-tests"
          "$RUNNER_TEMP/recording-panel-tests"
      - name: Compile optional native recording window (no device access)
        run: swiftc scripts/recording-panel-state.swift scripts/recording-host-macos.swift -o "$RUNNER_TEMP/recording-host"
