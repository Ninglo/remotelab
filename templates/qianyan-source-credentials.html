<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>公众号 API Key · 前沿追踪</title>
<style nonce="{{NONCE}}">
:root{color-scheme:light dark;--bg:#f8f8fa;--panel:#fff;--ink:#1c1c1e;--muted:#636366;--line:#e5e5ea;--accent:#1c1c1e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,-apple-system,sans-serif}main{max-width:480px;margin:10vh auto;padding:24px;background:var(--panel);border:1px solid var(--line);border-radius:12px}h1{font-size:24px;margin:8px 0 12px}.eyebrow,.hint{color:var(--muted);font-size:14px}label{display:block;font-weight:600;margin:24px 0 8px}input,button{width:100%;font:inherit;border-radius:8px;padding:12px}input{border:1px solid var(--line);background:var(--panel);color:var(--ink)}input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}button{border:0;background:var(--accent);color:#fff;cursor:pointer;margin-top:16px}button:disabled{opacity:.55;cursor:default}#status{min-height:26px;margin:16px 0 0}a{color:var(--accent)}@media(max-width:520px){main{margin:24px 16px;padding:24px}}@media(prefers-color-scheme:dark){:root{--bg:#14171d;--panel:#20252e;--ink:#e9edf5;--muted:#a3aec0;--line:#424c5c;--accent:#e9edf5}button{color:#17202e}}
</style></head><body><main>
<div class="eyebrow">前沿追踪 · 极致了 Dajiala</div><h1>保存公众号 API Key</h1>
<p>粘贴你刚获取的 API Key，供前沿追踪读取公众号使用。</p>
<form id="key-form" autocomplete="off"><label for="key">API Key</label><input id="key" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="4096" required placeholder="粘贴 API Key"><button id="save" type="submit">安全保存</button></form>
<p class="hint">通过本站 HTTPS 直接保存到后台私有凭据文件。密钥不进入聊天记录、公开网页或浏览器本地存储，保存后不再显示。</p>
<p id="status" role="status" aria-live="polite"></p><p><a href="/public-pages/qianyan-workbench-sources-20260929/index.html#/sources">返回信源页</a></p>
</main><script nonce="{{NONCE}}">
'use strict';
const endpoint='/api/qianyan/internal/source-credentials', input=document.getElementById('key'), button=document.getElementById('save'), status=document.getElementById('status');
fetch(endpoint+'/status',{credentials:'same-origin',cache:'no-store'}).then(r=>r.ok?r.json():null).then(v=>{if(v?.configured)status.textContent='已有已保存的密钥。重新提交会替换公众号密钥。';}).catch(()=>{});
document.getElementById('key-form').addEventListener('submit',async event=>{
 event.preventDefault();button.disabled=true;status.textContent='正在保存…';
 const body=JSON.stringify({key:input.value});input.value='';
 try{const response=await fetch(endpoint,{method:'POST',credentials:'same-origin',cache:'no-store',headers:{'Content-Type':'application/json','X-Form-Token':'{{FORM_TOKEN}}'},body});const value=await response.json();
  if(!response.ok||!value.saved)throw new Error(value.error||'尚未保存，请刷新后重试');
  input.disabled=true;button.textContent='已保存';status.textContent='密钥已保存。可返回对话；后续读取将使用这份密钥。';
 }catch(error){status.textContent=error.message+'。';button.textContent='请刷新后重试';}
});
</script></body></html>
