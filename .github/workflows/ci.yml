name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # GitHub-hosted runners appear inside a system service cgroup but cannot
      # create transient systemd services. Keep integration tests on the
      # supported unprivileged detached-process path.
      REMOTELAB_DISABLE_SYSTEMD_DETACHED_RUNNER: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 18.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install recording audio test dependency
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Verify recording audio and retry behavior
        run: npm run test:recording

      - name: Verify package boundary
        run: node tests/test-package-publish-boundary.mjs

      - name: Verify post-meeting ingestion and recovery
        run: npm run test:meeting-ingest

      - name: Verify social publishing without real accounts
        run: node scripts/run-with-clean-instance-env.mjs node --test tests/test-social-publish.mjs

      - name: Verify signed Feishu helper updates and rollback
        run: node scripts/run-with-clean-instance-env.mjs python3 tests/test-feishu-helper-update.py

      - name: Run smoke tests
        run: npm test

      - name: Run automation lifecycle checks
        run: npm run test:triggers

      - name: Report oversized source files
        run: npm run lint:filesize -- --github-actions

  recording-macos:
    name: recording macOS adapter
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Verify isolated Feishu display identity and icon on macOS
        run: python3 tests/test-feishu-native-identity.py
      - name: Compile device-specific keypad adapter (no device access)
        run: swiftc scripts/recording-input-macos.swift -o "$RUNNER_TEMP/remotelab-recording-input"
      - name: Verify recording indicator states (no device access)
        run: |
          swiftc scripts/recording-panel-state.swift tests/test-recording-panel-state.swift -o "$RUNNER_TEMP/recording-panel-tests"
          "$RUNNER_TEMP/recording-panel-tests"
      - name: Compile optional native recording window (no device access)
        run: swiftc scripts/recording-panel-state.swift scripts/recording-host-macos.swift -o "$RUNNER_TEMP/recording-host"

  documentation:
    name: Documentation impact and site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 18.x
      - name: Check documentation impact
        env:
          DOC_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DOC_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$DOC_BASE" ] || [ "$DOC_BASE" = "0000000000000000000000000000000000000000" ]; then
            DOC_BASE=$(git rev-parse "$DOC_HEAD^")
          fi
          node scripts/check-documentation-impact.mjs --base "$DOC_BASE" --head "$DOC_HEAD"
      - name: Verify documentation behavior
        run: node --test tests/test-documentation-delivery.mjs
      - name: Build the existing system guide
        run: node scripts/documentation-site.mjs build --out "$RUNNER_TEMP/remotelab-guide"
      - uses: actions/upload-artifact@v4
        with:
          name: remotelab-system-guide
          path: ${{ runner.temp }}/remotelab-guide
