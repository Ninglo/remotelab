<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>员工登录</title>
  <meta name="color-scheme" content="light dark">
  <style nonce="{{NONCE}}">
    :root{color-scheme:light dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f8f8fa;color:#1c1c1e}
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px}
    main{width:min(100%,420px);padding:36px;background:#fff;border:1px solid #e5e5ea;border-radius:18px}
    h1{font-size:26px;line-height:1.3;margin:0 0 14px}p{font-size:15px;line-height:1.7;color:#636366;margin:0 0 24px}
    a,button{display:block;width:100%;padding:14px 20px;border:0;border-radius:10px;background:#1c1c1e;color:white;text-align:center;text-decoration:none;font:inherit;cursor:pointer}
    a:focus-visible,button:focus-visible{outline:3px solid #78a6ff;outline-offset:3px}[hidden]{display:none!important}
    #status{font-size:14px;margin:20px 0 0;min-height:24px}footer{margin-top:24px;color:#8e8e93;font-size:13px}
    @media(prefers-color-scheme:dark){:root{background:#161618;color:#e5e5ea}main{background:#1c1c1f;border-color:#2c2c30}p{color:#a1a1a8}a,button{background:#e5e5ea;color:#161618}}
    @media(max-width:480px){main{padding:28px 24px}}
  </style>
  <script src="/site-login.js" defer></script>
</head>
<body><main>
  <h1>员工登录</h1>
  <p>使用公司飞书账号确认身份，即可访问内部网站。</p>
  <a id="authorize" target="_blank" rel="noopener noreferrer" hidden>使用飞书登录</a>
  <button id="retry" hidden>重新连接</button>
  <p id="status" role="status" aria-live="polite">正在检查登录状态…</p>
  <footer>已有有效登录时会自动进入，无需另设网站密码。</footer>
</main></body></html>
